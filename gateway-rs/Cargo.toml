[package]
name = "gateway-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "=0.22.1"
bytes = "1"
getrandom = "0.4"
gstreamer = { version = "=0.25.3", features = ["v1_22"] }
gstreamer-app = { version = "=0.25.2", features = ["v1_22"] }
moq-native-ietf = { git = "https://github.com/cloudflare/moq-rs", rev = "bf87128affd316463e5dcc7599a45001f222b6de", version = "=0.10.0" }
moq-transport = { git = "https://github.com/cloudflare/moq-rs", rev = "bf87128affd316463e5dcc7599a45001f222b6de", version = "=0.16.1" }
mp4 = "=0.14.0"
rfc6381-codec = "=0.2.0"
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "=1.15.1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shiguredo-srt = { package = "shiguredo_srt", version = "=2026.1.0-canary.1" }
tokio = { version = "~1.51.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "=2.5.8"

[dev-dependencies]
anyhow = "=1.0.104"
async-trait = "=0.1.89"
hyper = "=1.4.1"
hyper-util = "=0.1.3"
moq-relay-ietf = { git = "https://github.com/cloudflare/moq-rs", rev = "bf87128affd316463e5dcc7599a45001f222b6de", version = "=0.7.25" }
pem = "=3.0.6"
rcgen = { version = "=0.14.9", default-features = false, features = ["crypto", "pem", "ring"] }
sha2 = "=0.10.9"
time = "=0.3.55"
tokio = { version = "~1.51.0", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
