services:
  input-observer:
    image: bluenviron/mediamtx:1.20.0@sha256:86e63af28616d5e5a18540d7b031b6510bd4cbf1a3c7d224f9e2976f02aefbfb
    command: ["/mediamtx.yml"]
    ports:
      - "127.0.0.1:8889:8889/tcp"
      - "127.0.0.1:8189:8189/udp"
      - "127.0.0.1:8890:8890/udp"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
