services:
  gateway-rs:
    image: ubuntu:latest
    container_name: teremoq-gateway-rs
    command: ["tail", "-f", "/dev/null"]
    ports:
      - "9000:9000/udp"   # Ingesta SRT
      - "4433:4433/tcp"   # QUIC/WebTransport
      - "4433:4433/udp"   # QUIC/WebTransport
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: teremoq-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: teremoq-n8n
    ports:
      - "5678:5678"
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_HOST: 127.0.0.1
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_LISTEN_ADDRESS: "0.0.0.0"
      WEBHOOK_URL: http://127.0.0.1:5678/
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    container_name: teremoq-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
  n8n_data:
